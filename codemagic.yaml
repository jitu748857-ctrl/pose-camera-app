workflows:
  android-workflow:
    name: Android Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Create android platform files
        script: flutter create --platforms=android --project-name pose_camera_app .
      - name: Add permissions and settings
        script: |
          sed -i '' 's|<application|<uses-permission android:name="android.permission.CAMERA"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          sed -i '' 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts || true
          sed -i '' 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle || true
      - name: Disable lint for all plugins
        script: |
          mkdir -p $HOME/.gradle
          cat > $HOME/.gradle/init.gradle <<'EOF'
          allprojects {
              tasks.configureEach { task ->
                  if (task.name.startsWith("lint")) {
                      task.enabled = false
                  }
              }
          }
          EOF
      - name: Get packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/**/outputs/**/*.apk
